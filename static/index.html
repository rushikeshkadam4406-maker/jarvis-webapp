<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>J.A.R.V.I.S</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020812;
  color:#d9f3ff;
  font-family:'Share Tech Mono', monospace;
  height:100vh;
  overflow:hidden;
}

/* ===================================== */
/* BACKGROUND */
/* ===================================== */

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:0;
}

body::after{
  content:'';
  position:fixed;
  width:700px;
  height:300px;
  background:radial-gradient(circle, rgba(0,180,255,0.08), transparent 70%);
  top:-80px;
  left:50%;
  transform:translateX(-50%);
  z-index:0;
}

/* ===================================== */
/* APP */
/* ===================================== */

.app{
  position:relative;
  z-index:1;
  height:100vh;
  width:100%;
  max-width:900px;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:14px;
  gap:12px;
}

/* ===================================== */
/* HEADER */
/* ===================================== */

.header{
  text-align:center;
  flex-shrink:0;
}

.logo{
  font-family:'Orbitron', sans-serif;
  font-size:clamp(24px, 5vw, 42px);
  font-weight:900;
  letter-spacing:0.25em;
  color:#00d0ff;
  text-shadow:0 0 20px rgba(0,200,255,0.6);
}

.sub{
  font-size:10px;
  letter-spacing:0.25em;
  opacity:0.5;
  margin-top:4px;
}

.status{
  margin-top:10px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.pill{
  border:1px solid rgba(0,200,255,0.25);
  background:rgba(0,40,80,0.45);
  padding:4px 10px;
  border-radius:4px;
  font-size:10px;
  color:#66dfff;
}

/* ===================================== */
/* CHAT */
/* ===================================== */

.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  border:1px solid rgba(0,200,255,0.18);
  background:rgba(0,15,30,0.82);
  border-radius:12px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:14px;
  backdrop-filter:blur(10px);
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(0,200,255,0.3);
  border-radius:4px;
}

/* ===================================== */
/* MESSAGE */
/* ===================================== */

.msg{
  display:flex;
  gap:10px;
  animation:fade .25s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.msg.user{
  flex-direction:row-reverse;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
  flex-shrink:0;
  border:1px solid rgba(0,200,255,0.25);
}

.msg.assistant .avatar{
  background:rgba(0,180,255,0.12);
  color:#00d4ff;
}

.msg.user .avatar{
  background:rgba(0,255,180,0.1);
  color:#00ffbf;
}

.bubble{
  max-width:78%;
  padding:12px 14px;
  border-radius:10px;
  line-height:1.6;
  font-size:14px;
  word-wrap:break-word;
}

.msg.assistant .bubble{
  background:rgba(0,40,80,0.65);
  border:1px solid rgba(0,200,255,0.16);
}

.msg.user .bubble{
  background:rgba(0,60,30,0.45);
  border:1px solid rgba(0,255,180,0.16);
}

/* ===================================== */
/* INPUT */
/* ===================================== */

.input-area{
  flex-shrink:0;
  display:flex;
  gap:10px;
  align-items:flex-end;
  background:rgba(0,12,25,0.9);
  border:1px solid rgba(0,200,255,0.2);
  border-radius:14px;
  padding:10px;
}

textarea{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  resize:none;
  color:white;
  font-size:14px;
  font-family:'Share Tech Mono', monospace;
  min-height:42px;
  max-height:120px;
  overflow-y:auto;
  padding:10px 4px;
}

textarea::placeholder{
  color:rgba(180,220,255,0.35);
}

.controls{
  display:flex;
  gap:8px;
}

/* ===================================== */
/* BUTTONS */
/* ===================================== */

.btn{
  width:46px;
  height:46px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.2s;
}

.send-btn{
  background:linear-gradient(135deg,#0099ff,#005eff);
  color:white;
}

.send-btn:hover{
  transform:scale(1.05);
}

.mic-btn{
  background:rgba(0,180,255,0.15);
  color:#00d4ff;
  border:1px solid rgba(0,200,255,0.3);
}

.mic-btn.listening{
  animation:pulse 1s infinite;
  background:rgba(0,200,255,0.25);
}

@keyframes pulse{
  0%{
    box-shadow:0 0 0 rgba(0,200,255,0.3);
  }
  50%{
    box-shadow:0 0 24px rgba(0,200,255,0.8);
  }
  100%{
    box-shadow:0 0 0 rgba(0,200,255,0.3);
  }
}

svg{
  width:20px;
  height:20px;
}

/* ===================================== */
/* MOBILE */
/* ===================================== */

@media(max-width:600px){

  .app{
    padding:8px;
  }

  .bubble{
    max-width:88%;
    font-size:13px;
  }

  .logo{
    letter-spacing:0.15em;
  }

  .input-area{
    padding:8px;
  }

  .btn{
    width:42px;
    height:42px;
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S</div>
    <div class="sub">
      JUST A RATHER VERY INTELLIGENT SYSTEM
    </div>

    <div class="status">
      <div class="pill" id="apiStatus">
        ● SYSTEM ONLINE
      </div>

      <div class="pill" id="micStatus">
        MIC READY
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat">

    <div class="msg assistant">
      <div class="avatar">JV</div>

      <div class="bubble">
        Jarvis activated. Good to see you, sir. How can I assist?
      </div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="input-area">

    <textarea
      id="textInput"
      placeholder="Message Jarvis..."
      rows="1"
    ></textarea>

    <div class="controls">

      <!-- MIC -->
      <button class="btn mic-btn" id="micBtn">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>

      </button>

      <!-- SEND -->
      <button class="btn send-btn" id="sendBtn">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>

      </button>

    </div>

  </div>

</div>

<script>

// =====================================
// ELEMENTS
// =====================================

const chat = document.getElementById("chat");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

let recognition;

// =====================================
// ADD MESSAGE
// =====================================

function addMessage(role, text){

  const msg = document.createElement("div");

  msg.className = "msg " + role;

  const avatar = role === "assistant"
    ? "JV"
    : "YOU";

  msg.innerHTML = `
    <div class="avatar">${avatar}</div>

    <div class="bubble">
      ${text}
    </div>
  `;

  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;
}

// =====================================
// SPEAK
// =====================================

function speak(text){

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);

  utter.rate = 1;
  utter.pitch = 0.9;

  speechSynthesis.speak(utter);
}

// =====================================
// SEND MESSAGE
// =====================================

async function sendMessage(customText=null){

  const text = customText || textInput.value.trim();

  if(!text) return;

  addMessage("user", text);

  textInput.value = "";

  try{

    const response = await fetch("/chat", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:text
      })

    });

    const data = await response.json();

    const reply =
      data.reply ||
      "Sorry sir, I encountered an error.";

    addMessage("assistant", reply);

    speak(reply);

  }catch(err){

    addMessage(
      "assistant",
      "Server connection failed."
    );
  }
}

// =====================================
// ENTER KEY
// =====================================

textInput.addEventListener("keydown", (e)=>{

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();

    sendMessage();
  }
});

// =====================================
// SEND BUTTON
// =====================================

sendBtn.onclick = ()=> sendMessage();

// =====================================
// AUTO RESIZE
// =====================================

textInput.addEventListener("input", ()=>{

  textInput.style.height = "auto";

  textInput.style.height =
    textInput.scrollHeight + "px";
});

// =====================================
// SPEECH RECOGNITION
// =====================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition){

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = ()=>{

    micBtn.classList.add("listening");

    document.getElementById("micStatus").innerText =
      "LISTENING...";
  };

  recognition.onend = ()=>{

    micBtn.classList.remove("listening");

    document.getElementById("micStatus").innerText =
      "MIC READY";
  };

  recognition.onerror = (event)=>{

    console.log(event.error);

    micBtn.classList.remove("listening");
  };

  recognition.onresult = (event)=>{

    const transcript =
      event.results[0][0].transcript;

    console.log("HEARD:", transcript);

    if(transcript){

      sendMessage(transcript);
    }
  };

  micBtn.onclick = ()=>{

    try{

      recognition.start();

    }catch(err){

      console.log(err);
    }
  };

}else{

  alert(
    "Speech Recognition not supported in this browser."
  );
}

</script>

</body>
</html>
