<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #00c8ff;
    --cyan-glow: rgba(0,200,255,0.4);
    --green: #00ffb3;
    --amber: #ffb300;
    --red: #ff4466;
    --bg: #020810;
    --panel: rgba(0,20,40,0.85);
    --border: rgba(0,180,255,0.18);
  }

  html {
    height: 100%;
    height: -webkit-fill-available;
  }
  body {
    min-height: 100%;
    min-height: -webkit-fill-available;
    background: var(--bg);
    color: #cce8ff; font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridShift 20s linear infinite;
  }
  @keyframes gridShift {
    from { background-position: 0 0; }
    to   { background-position: 48px 48px; }
  }
  body::after {
    content: ''; position: fixed;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 800px; height: 350px;
    background: radial-gradient(ellipse, rgba(0,150,255,0.07) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* Corner brackets */
  .corner { position: fixed; width: 50px; height: 50px; border-color: rgba(0,200,255,0.1); border-style: solid; pointer-events: none; z-index: 2; }
  .corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

  /* ── APP LAYOUT ── */
  .app {
    position: relative; z-index: 1;
    height: 100vh;
    height: -webkit-fill-available;
    display: flex; flex-direction: column;
    max-width: 780px; margin: 0 auto;
    padding: 16px 16px calc(14px + env(safe-area-inset-bottom));
    gap: 8px;
  }

  /* ── HEADER ── */
  header { text-align: center; flex-shrink: 0; }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 4vw, 32px); font-weight: 900;
    letter-spacing: 0.35em; color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan-glow), 0 0 60px rgba(0,200,255,0.15);
    animation: logoFlicker 7s ease-in-out infinite;
  }
  @keyframes logoFlicker {
    0%,93%,95%,97%,100% { opacity:1; }
    94%,96% { opacity:0.8; }
  }
  .tagline { font-size: 8px; letter-spacing: 0.3em; color: rgba(0,200,255,0.3); margin-top: 3px; text-transform: uppercase; }

  .status-bar { display: flex; justify-content: center; gap: 20px; margin-top: 8px; }
  .status-pill {
    font-size: 8px; letter-spacing: 0.2em; padding: 2px 10px;
    border: 1px solid var(--border); border-radius: 2px;
    color: rgba(0,200,255,0.45); background: rgba(0,30,60,0.4); text-transform: uppercase;
  }
  .status-pill.online { color: var(--green); border-color: rgba(0,255,179,0.3); }

  /* ── CHAT LOG ── */
  .chat-log {
    flex: 1; min-height: 0;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 4px; padding: 14px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth; backdrop-filter: blur(8px);
  }
  .chat-log::-webkit-scrollbar { width: 3px; }
  .chat-log::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.18); border-radius: 2px; }

  .msg { display: flex; gap: 10px; animation: msgIn 0.28s ease-out; }
  @keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px; border-radius: 3px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; flex-shrink: 0; font-family: 'Orbitron', sans-serif; font-weight: 700;
  }
  .msg.assistant .avatar { color: var(--cyan); background: rgba(0,200,255,0.08); }
  .msg.user .avatar { color: var(--green); background: rgba(0,255,179,0.06); border-color: rgba(0,255,179,0.2); }

  .bubble {
    max-width: 78%; padding: 9px 13px;
    font-size: 12.5px; line-height: 1.6; letter-spacing: 0.02em; border-radius: 2px;
  }
  .msg.assistant .bubble {
    background: rgba(0,25,55,0.75); border: 1px solid rgba(0,200,255,0.13);
    border-left: 2px solid var(--cyan); color: #b8deff;
  }
  .msg.user .bubble {
    background: rgba(0,45,20,0.5); border: 1px solid rgba(0,255,179,0.18);
    border-right: 2px solid var(--green); color: #aaffdd; text-align: right;
  }
  .msg-label { font-size: 7px; letter-spacing: 0.2em; opacity: 0.4; margin-bottom: 3px; text-transform: uppercase; }

  /* Image/file preview in bubble */
  .bubble img { max-width: 200px; max-height: 150px; border-radius: 3px; display: block; margin-bottom: 6px; border: 1px solid rgba(0,200,255,0.2); }
  .file-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,100,200,0.15); border: 1px solid rgba(0,200,255,0.25);
    border-radius: 3px; padding: 4px 10px; font-size: 10px; color: var(--cyan); margin-bottom: 6px;
  }

  .thinking-dots { display: flex; gap: 5px; padding: 4px 0; }
  .thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: dotPulse 1s ease-in-out infinite; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse { 0%,100% { opacity:0.2; transform:scale(0.8); } 50% { opacity:1; transform:scale(1.2); } }

  /* ── TRANSCRIPT BAR ── */
  .transcript-bar {
    flex-shrink: 0; height: 18px; text-align: center;
    font-size: 10px; color: rgba(0,200,255,0.45); font-style: italic; letter-spacing: 0.04em;
  }

  /* ── ATTACHMENT PREVIEWS ── */
  .attachment-previews {
    display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0;
    padding: 0 2px;
  }
  .attachment-previews:empty { display: none; }

  .preview-chip {
    position: relative; display: flex; align-items: center; gap: 6px;
    background: rgba(0,30,60,0.8); border: 1px solid rgba(0,200,255,0.25);
    border-radius: 3px; padding: 4px 8px; font-size: 10px; color: #88bbdd;
    animation: msgIn 0.2s ease-out;
  }
  .preview-chip img { width: 36px; height: 36px; object-fit: cover; border-radius: 2px; }
  .preview-chip .remove-btn {
    position: absolute; top: -6px; right: -6px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--red); color: #fff; border: none; cursor: pointer;
    font-size: 9px; display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* ── BOTTOM INPUT BAR ── */
  .input-bar {
    flex-shrink: 0;
    background: rgba(0,15,35,0.92);
    border: 1px solid rgba(0,200,255,0.22);
    border-radius: 12px;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 12px;
    display: flex; align-items: flex-end; gap: 8px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(0,100,200,0.1), inset 0 1px 0 rgba(0,200,255,0.06);
    transition: border-color 0.2s;
  }
  .input-bar:focus-within { border-color: rgba(0,200,255,0.4); box-shadow: 0 0 40px rgba(0,150,255,0.12); }

  /* Left action buttons */
  .action-btns { display: flex; gap: 6px; flex-shrink: 0; padding-bottom: 2px; }

  .act-btn {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(0,200,255,0.2);
    background: rgba(0,50,100,0.3); color: rgba(0,180,255,0.6);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .act-btn:hover { background: rgba(0,100,180,0.35); color: var(--cyan); border-color: rgba(0,200,255,0.5); box-shadow: 0 0 12px rgba(0,150,255,0.2); }
  .act-btn svg { width: 16px; height: 16px; }
  .act-btn.active { background: rgba(0,200,255,0.15); color: var(--cyan); border-color: rgba(0,200,255,0.5); }

  /* Hidden file inputs */
  #photoInput, #fileInput { display: none; }

  /* Text area */
  .text-input {
    flex: 1; min-height: 36px; max-height: 120px;
    background: transparent; border: none; outline: none; resize: none;
    color: #c8e4ff; font-family: 'Share Tech Mono', monospace;
    font-size: 13px; line-height: 1.5; letter-spacing: 0.02em;
    padding: 8px 0; overflow-y: auto; align-self: center;
  }
  .text-input::placeholder { color: rgba(0,150,200,0.35); }
  .text-input::-webkit-scrollbar { width: 2px; }
  .text-input::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.2); }

  /* Right buttons */
  .right-btns { display: flex; gap: 6px; align-items: flex-end; flex-shrink: 0; padding-bottom: 2px; }

  /* Mic button */
  .mic-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s; flex-shrink: 0; position: relative;
  }
  .mic-btn.idle {
    background: rgba(0,80,160,0.25); border: 1.5px solid rgba(0,200,255,0.3); color: rgba(0,180,255,0.6);
  }
  .mic-btn.idle:hover { background: rgba(0,120,220,0.3); color: var(--cyan); box-shadow: 0 0 16px rgba(0,150,255,0.25); }
  .mic-btn.listening {
    background: rgba(0,200,255,0.18); border: 1.5px solid var(--cyan); color: var(--cyan);
    box-shadow: 0 0 20px var(--cyan-glow), 0 0 40px rgba(0,200,255,0.1);
    animation: micPulse 1.2s ease-in-out infinite;
  }
  .mic-btn.thinking { background: rgba(255,179,0,0.12); border: 1.5px solid var(--amber); color: var(--amber); cursor: not-allowed; }
  .mic-btn.speaking { background: rgba(0,255,179,0.12); border: 1.5px solid var(--green); color: var(--green); animation: micPulse 1.5s ease-in-out infinite; }

  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 12px currentColor; }
    50%      { box-shadow: 0 0 28px currentColor; }
  }
  .mic-btn svg { width: 18px; height: 18px; }

  /* Waveform bars inside mic btn */
  .mic-wave { display: flex; align-items: center; gap: 2px; height: 18px; }
  .mic-wave span { width: 2.5px; border-radius: 2px; background: currentColor; animation: waveBar 0.45s ease-in-out infinite alternate; }
  .mic-wave span:nth-child(1) { height: 6px;  animation-delay: 0s; }
  .mic-wave span:nth-child(2) { height: 14px; animation-delay: 0.08s; }
  .mic-wave span:nth-child(3) { height: 18px; animation-delay: 0.04s; }
  .mic-wave span:nth-child(4) { height: 11px; animation-delay: 0.12s; }
  .mic-wave span:nth-child(5) { height: 6px;  animation-delay: 0.06s; }
  @keyframes waveBar { from { transform: scaleY(0.4); opacity:0.5; } to { transform: scaleY(1); opacity:1; } }

  /* Send button */
  .send-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg, rgba(0,150,255,0.35), rgba(0,80,200,0.35));
    border: 1.5px solid rgba(0,200,255,0.4); color: var(--cyan);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover { background: linear-gradient(135deg, rgba(0,180,255,0.4), rgba(0,100,220,0.4)); box-shadow: 0 0 20px rgba(0,150,255,0.3); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn svg { width: 17px; height: 17px; }

  /* Error */
  .error-msg { flex-shrink: 0; font-size: 9px; color: var(--red); text-align: center; letter-spacing: 0.1em; min-height: 14px; }

  /* Listening ring on mic button */
  .mic-ring {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid var(--cyan); opacity: 0; pointer-events: none;
    animation: ringExpand 1.5s ease-out infinite;
  }
  .mic-ring:nth-child(2) { animation-delay: 0.5s; }
  @keyframes ringExpand {
    0%   { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.8); opacity: 0; }
  }
</style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">J.A.R.V.I.S</div>
    <div class="tagline">Just A Rather Very Intelligent System</div>
    <div class="status-bar">
      <span class="status-pill online" id="apiStatus">● API ONLINE</span>
      <span class="status-pill" id="micStatus">MIC READY</span>
    </div>
  </header>

  <!-- CHAT LOG -->
  <div class="chat-log" id="chatLog">
    <div class="msg assistant">
      <div class="avatar">JV</div>
      <div>
        <div class="msg-label">Jarvis</div>
        <div class="bubble">Jarvis activated. Good to see you, sir. How can I assist?</div>
      </div>
    </div>
  </div>

  <!-- LIVE TRANSCRIPT -->
  <div class="transcript-bar" id="transcriptBar"></div>

  <!-- ATTACHMENT PREVIEWS -->
  <div class="attachment-previews" id="attachmentPreviews"></div>

  <!-- ERROR -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- ── BOTTOM INPUT BAR ── -->
  <div class="input-bar">

    <!-- Left: Photo + File buttons -->
    <div class="action-btns">
      <!-- Photo button -->
      <button class="act-btn" title="Attach photo" onclick="document.getElementById('photoInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="12" cy="12" r="3.5"/>
          <path d="M8 5l1.5-2h5L16 5"/>
        </svg>
      </button>
      <!-- File button -->
      <button class="act-btn" title="Attach file" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
      </button>
    </div>

    <!-- Hidden inputs -->
    <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotoAttach(this)"/>
    <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx,.csv,.json,.py,.js,.md" multiple onchange="handleFileAttach(this)"/>

    <!-- Text area -->
    <textarea
      class="text-input"
      id="textInput"
      placeholder="Message Jarvis..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>

    <!-- Right: Mic + Send -->
    <div class="right-btns">
      <button class="mic-btn idle" id="micBtn" onclick="toggleListen()" title="Voice input">
        <!-- rings shown when listening -->
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>

      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
// =========================================
// STATE
// =========================================
let appState = 'idle'; // idle | listening | thinking | speaking
let recognition = null;
let conversationHistory = [];
let mediaRecorder = null;
let audioChunks = [];
let attachedFiles = []; // { type: 'image'|'file', name, dataUrl, file }

// =========================================
// STATE MANAGER
// =========================================
function setState(s) {
  appState = s;
  const micBtn = document.getElementById('micBtn');
  const micIcon = document.getElementById('micIcon');

  // Remove rings
  micBtn.querySelectorAll('.mic-ring').forEach(r => r.remove());

  micBtn.className = 'mic-btn ' + s;

  // Swap icon
  if (s === 'listening') {
    micIcon.outerHTML = `<div class="mic-wave" id="micIcon"><span></span><span></span><span></span><span></span><span></span></div>`;
    // Add rings
    const r1 = document.createElement('div'); r1.className = 'mic-ring';
    const r2 = document.createElement('div'); r2.className = 'mic-ring';
    micBtn.appendChild(r1); micBtn.appendChild(r2);
  } else {
    const el = document.getElementById('micIcon');
    if (el && el.tagName !== 'svg') {
      el.outerHTML = `<svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>`;
    }
  }

  const isBusy = s === 'thinking' || s === 'listening';
  document.getElementById('sendBtn').disabled = isBusy;
  micBtn.disabled = s === 'thinking';
}

// =========================================
// CHAT LOG
// =========================================
function addMessage(role, text, attachments=[], isThinking=false) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (isThinking) div.id = 'thinkingMsg';

  const avatarText = role === 'assistant' ? 'JV' : 'YOU';
  const label = role === 'assistant' ? 'Jarvis' : 'You';

  let contentHtml = '';

  // Attachments preview
  if (attachments && attachments.length > 0) {
    attachments.forEach(att => {
      if (att.type === 'image') {
        contentHtml += `<img src="${att.dataUrl}" alt="${att.name}"/>`;
      } else {
        contentHtml += `<div class="file-chip">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          ${att.name}
        </div>`;
      }
    });
  }

  if (isThinking) {
    contentHtml = `<div class="thinking-dots"><span></span><span></span><span></span></div>`;
  } else if (text) {
    contentHtml += `<span>${escHtml(text)}</span>`;
  }

  div.innerHTML = `
    <div class="avatar">${avatarText}</div>
    <div style="max-width:78%">
      <div class="msg-label">${label}</div>
      <div class="bubble">${contentHtml}</div>
    </div>
  `;

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function removeThinking() {
  const el = document.getElementById('thinkingMsg');
  if (el) el.remove();
}

// =========================================
// SPEAK
// =========================================
function speak(text) {
  return new Promise(resolve => {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.05; utter.pitch = 0.85; utter.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.name.includes('Google UK English Male') || v.name.includes('Daniel') ||
      v.name.includes('Microsoft David') || v.lang === 'en-GB'
    ) || voices.find(v => v.lang.startsWith('en'));
    if (preferred) utter.voice = preferred;
    setState('speaking');
    window.speechSynthesis.speak(utter);
    utter.onend = () => { setState('idle'); resolve(); };
    utter.onerror = () => { setState('idle'); resolve(); };
  });
}

// =========================================
// SEND MESSAGE
// =========================================
async function sendMessage() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  const files = [...attachedFiles];

  if (!text && files.length === 0) return;
  if (appState === 'thinking' || appState === 'listening') return;

  input.value = '';
  autoResize(input);
  clearAttachments();

  addMessage('user', text, files);
  conversationHistory.push({ role: 'user', text: text || '[attached file]' });

  setState('thinking');
  addMessage('assistant', '', [], true);
  setError('');

  try {
    // Build prompt with file context hint
    let prompt = text || '';
    if (files.length > 0) {
      const names = files.map(f => f.name).join(', ');
      prompt += (prompt ? '\n' : '') + `[User also attached: ${names}]`;
    }

    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: prompt, history: conversationHistory.slice(-8) })
    });

    const data = await res.json();
    const reply = data.reply || "I'm sorry, sir. Could you repeat that?";

    removeThinking();
    addMessage('assistant', reply);
    conversationHistory.push({ role: 'assistant', text: reply });

    if (/\b(exit|goodbye|shut down|shutting down)\b/i.test(text)) {
      await speak(reply); setState('idle'); return;
    }
    await speak(reply);
  } catch(e) {
    removeThinking();
    setError('Server error. Is the backend running?');
    setState('idle');
  }
}

// =========================================
// VOICE INPUT
// =========================================
async function toggleListen() {
  if (appState === 'listening') { stopRecording(); return; }
  if (appState !== 'idle') return;
  window.speechSynthesis.cancel();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById('micStatus').textContent = '● MIC ACTIVE';
    document.getElementById('micStatus').classList.add('online');

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      document.getElementById('micStatus').textContent = 'MIC READY';
      document.getElementById('micStatus').classList.remove('online');
      document.getElementById('transcriptBar').textContent = '';

      if (!audioChunks.length) { setState('idle'); return; }

      setState('thinking');
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const fd = new FormData();
      fd.append('audio', blob, 'recording.webm');

      try {
        const res = await fetch('/transcribe', { method: 'POST', body: fd });
        const data = await res.json();
        const text = (data.text || '').trim();
        if (!text) { setState('idle'); setError('Could not understand. Try again.'); return; }
        setError('');
        document.getElementById('textInput').value = text;
        autoResize(document.getElementById('textInput'));
        setState('idle');
        await sendMessage();
      } catch(e) {
        setState('idle');
        setError('Transcription failed. Is the backend running?');
      }
    };

    mediaRecorder.start();
    setState('listening');

    // Browser SR for live visual transcript only
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.continuous = true; recognition.interimResults = true;
      recognition.onresult = e => {
        const t = Array.from(e.results).map(r => r[0].transcript).join('');
        document.getElementById('transcriptBar').textContent = '"' + t + '"';
      };
      try { recognition.start(); } catch(_) {}
    }
  } catch(e) {
    setError('Microphone access denied.');
    setState('idle');
  }
}

function stopRecording() {
  if (recognition) { try { recognition.stop(); } catch(_) {} recognition = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

// =========================================
// ATTACHMENTS
// =========================================
function handlePhotoAttach(input) {
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      attachedFiles.push({ type: 'image', name: file.name, dataUrl: e.target.result, file });
      renderAttachmentPreviews();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function handleFileAttach(input) {
  Array.from(input.files).forEach(file => {
    attachedFiles.push({ type: 'file', name: file.name, dataUrl: null, file });
    renderAttachmentPreviews();
  });
  input.value = '';
}

function renderAttachmentPreviews() {
  const container = document.getElementById('attachmentPreviews');
  container.innerHTML = '';
  attachedFiles.forEach((att, i) => {
    const chip = document.createElement('div');
    chip.className = 'preview-chip';
    if (att.type === 'image') {
      chip.innerHTML = `<img src="${att.dataUrl}" alt="${att.name}"/><span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${att.name}</span>`;
    } else {
      chip.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${att.name}</span>`;
    }
    const rm = document.createElement('button');
    rm.className = 'remove-btn';
    rm.innerHTML = '×';
    rm.onclick = () => { attachedFiles.splice(i, 1); renderAttachmentPreviews(); };
    chip.appendChild(rm);
    container.appendChild(chip);
  });
}

function clearAttachments() {
  attachedFiles = [];
  document.getElementById('attachmentPreviews').innerHTML = '';
}

// =========================================
// TEXTAREA AUTO-RESIZE
// =========================================
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// =========================================
// ERROR
// =========================================
function setError(msg) {
  document.getElementById('errorMsg').textContent = msg;
}

// =========================================
// INIT
// =========================================
window.speechSynthesis.onvoiceschanged = () => {};
window.addEventListener('load', () => {
  setTimeout(() => speak("Jarvis activated. Good to see you, sir. How can I assist?"), 900);
});
</script>
