<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #00c8ff;
    --cyan-dim: rgba(0,200,255,0.15);
    --cyan-glow: rgba(0,200,255,0.4);
    --green: #00ffb3;
    --amber: #ffb300;
    --red: #ff4466;
    --bg: #020810;
    --panel: rgba(0,20,40,0.85);
    --border: rgba(0,180,255,0.18);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: #cce8ff;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridShift 20s linear infinite;
  }

  @keyframes gridShift {
    from { background-position: 0 0; }
    to   { background-position: 48px 48px; }
  }

  /* Radial ambient */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 800px; height: 400px;
    background: radial-gradient(ellipse, rgba(0,150,255,0.07) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .app {
    position: relative; z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 16px;
    gap: 16px;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 900;
    letter-spacing: 0.35em;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan-glow), 0 0 60px rgba(0,200,255,0.2);
    animation: logoFlicker 6s ease-in-out infinite;
  }

  @keyframes logoFlicker {
    0%,94%,96%,98%,100% { opacity: 1; }
    95%,97% { opacity: 0.85; }
  }

  .tagline {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(0,200,255,0.35);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .status-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 10px;
  }

  .status-pill {
    font-size: 9px;
    letter-spacing: 0.2em;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: rgba(0,200,255,0.5);
    background: rgba(0,30,60,0.4);
    text-transform: uppercase;
  }

  .status-pill.online { color: var(--green); border-color: rgba(0,255,179,0.3); }

  /* ── CHAT LOG ── */
  .chat-log {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 4px;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    backdrop-filter: blur(8px);
  }

  .chat-log::-webkit-scrollbar { width: 4px; }
  .chat-log::-webkit-scrollbar-track { background: transparent; }
  .chat-log::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.2); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 10px;
    animation: msgIn 0.3s ease-out;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 3px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; letter-spacing: 0.05em;
    flex-shrink: 0;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
  }

  .msg.assistant .avatar { color: var(--cyan); background: rgba(0,200,255,0.08); }
  .msg.user .avatar { color: var(--green); background: rgba(0,255,179,0.06); border-color: rgba(0,255,179,0.2); }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.6;
    letter-spacing: 0.02em;
    border-radius: 2px;
  }

  .msg.assistant .bubble {
    background: rgba(0,30,60,0.7);
    border: 1px solid rgba(0,200,255,0.15);
    border-left: 2px solid var(--cyan);
    color: #b8deff;
  }

  .msg.user .bubble {
    background: rgba(0,50,20,0.5);
    border: 1px solid rgba(0,255,179,0.2);
    border-right: 2px solid var(--green);
    color: #aaffdd;
    text-align: right;
  }

  .msg-label {
    font-size: 8px;
    letter-spacing: 0.2em;
    opacity: 0.45;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  /* Thinking indicator */
  .thinking-dots { display: flex; gap: 5px; padding: 4px 0; }
  .thinking-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    animation: dotPulse 1s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%,100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }

  /* ── ORB AREA ── */
  .orb-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .transcript-display {
    height: 20px;
    font-size: 11px;
    color: rgba(0,200,255,0.5);
    font-style: italic;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .orb-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Pulse rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--cyan);
    opacity: 0;
    pointer-events: none;
  }

  .orb-wrap.listening .ring { animation: ringOut 1.6s ease-out infinite; }
  .orb-wrap.listening .ring:nth-child(2) { animation-delay: 0.4s; }
  .orb-wrap.listening .ring:nth-child(3) { animation-delay: 0.8s; }

  .orb-wrap.speaking .ring { border-color: var(--green); animation: ringOut 1.8s ease-out infinite; }
  .orb-wrap.speaking .ring:nth-child(2) { animation-delay: 0.5s; }
  .orb-wrap.speaking .ring:nth-child(3) { animation-delay: 1s; }

  @keyframes ringOut {
    0%   { width: 100px; height: 100px; opacity: 0.6; }
    100% { width: 220px; height: 220px; opacity: 0; }
  }

  /* The orb button */
  .orb {
    width: 100px; height: 100px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    transition: all 0.3s ease;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .orb.idle {
    background: radial-gradient(circle at 40% 35%, rgba(0,120,200,0.2), rgba(0,0,0,0.8));
    border: 2px solid rgba(0,150,200,0.35);
    color: #4488aa;
    box-shadow: 0 0 20px rgba(0,100,180,0.2), inset 0 0 30px rgba(0,0,0,0.5);
  }

  .orb.listening {
    background: radial-gradient(circle at 40% 35%, rgba(0,200,255,0.3), rgba(0,0,0,0.8));
    border: 2px solid var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 40px var(--cyan-glow), 0 0 80px rgba(0,200,255,0.15), inset 0 0 30px rgba(0,0,0,0.4);
  }

  .orb.thinking {
    background: radial-gradient(circle at 40% 35%, rgba(255,179,0,0.2), rgba(0,0,0,0.8));
    border: 2px solid var(--amber);
    color: var(--amber);
    box-shadow: 0 0 40px rgba(255,179,0,0.3), inset 0 0 30px rgba(0,0,0,0.5);
    cursor: not-allowed;
  }

  .orb.speaking {
    background: radial-gradient(circle at 40% 35%, rgba(0,255,179,0.2), rgba(0,0,0,0.8));
    border: 2px solid var(--green);
    color: var(--green);
    box-shadow: 0 0 40px rgba(0,255,179,0.3), inset 0 0 30px rgba(0,0,0,0.5);
  }

  /* Waveform bars inside orb when listening */
  .waveform {
    display: flex; align-items: center; gap: 3px;
  }
  .waveform .bar {
    width: 3px; border-radius: 2px; background: var(--cyan);
    animation: waveBar 0.5s ease-in-out infinite alternate;
  }
  .waveform .bar:nth-child(1) { height: 8px;  animation-delay: 0s; }
  .waveform .bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
  .waveform .bar:nth-child(3) { height: 22px; animation-delay: 0.05s; }
  .waveform .bar:nth-child(4) { height: 14px; animation-delay: 0.15s; }
  .waveform .bar:nth-child(5) { height: 8px;  animation-delay: 0.08s; }
  @keyframes waveBar {
    from { transform: scaleY(0.4); opacity: 0.5; }
    to   { transform: scaleY(1);   opacity: 1; }
  }

  /* Mic SVG */
  .mic-icon { width: 28px; height: 28px; }

  /* ── BOTTOM CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .text-input {
    flex: 1;
    background: rgba(0,20,40,0.7);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    color: #aaddff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.03em;
    outline: none;
    transition: border-color 0.2s;
  }

  .text-input:focus { border-color: rgba(0,200,255,0.5); }
  .text-input::placeholder { color: rgba(0,150,200,0.35); }

  .send-btn {
    padding: 10px 18px;
    background: rgba(0,100,180,0.2);
    border: 1px solid rgba(0,200,255,0.3);
    border-radius: 3px;
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .send-btn:hover { background: rgba(0,150,255,0.25); box-shadow: 0 0 12px var(--cyan-glow); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .error-msg {
    font-size: 10px;
    color: var(--red);
    text-align: center;
    letter-spacing: 0.1em;
    min-height: 16px;
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    width: 60px; height: 60px;
    border-color: rgba(0,200,255,0.12);
    border-style: solid;
    pointer-events: none; z-index: 0;
  }
  .corner.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

  @media (max-height: 600px) {
    .orb { width: 80px; height: 80px; }
    @keyframes ringOut {
      0%   { width: 80px; height: 80px; opacity: 0.6; }
      100% { width: 180px; height: 180px; opacity: 0; }
    }
  }
</style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">J.A.R.V.I.S</div>
    <div class="tagline">Just A Rather Very Intelligent System</div>
    <div class="status-bar">
      <span class="status-pill online" id="apiStatus">● API ONLINE</span>
      <span class="status-pill" id="micStatus">MIC READY</span>
    </div>
  </header>

  <!-- CHAT LOG -->
  <div class="chat-log" id="chatLog">
    <div class="msg assistant">
      <div class="avatar">JV</div>
      <div>
        <div class="msg-label">Jarvis</div>
        <div class="bubble">Jarvis activated. Good to see you, sir. How can I assist?</div>
      </div>
    </div>
  </div>

  <!-- ORB -->
  <div class="orb-area">
    <div class="transcript-display" id="transcriptDisplay"></div>
    <div class="orb-wrap idle" id="orbWrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <button class="orb idle" id="orbBtn" onclick="toggleListen()">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
        <span id="orbLabel">Tap to Speak</span>
      </button>
    </div>
  </div>

  <!-- TEXT INPUT -->
  <div>
    <div class="controls">
      <input
        type="text"
        class="text-input"
        id="textInput"
        placeholder="Or type your command here..."
        onkeydown="if(event.key==='Enter') sendText()"
      />
      <button class="send-btn" id="sendBtn" onclick="sendText()">SEND</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

</div>

<script>
// =========================================
// STATE
// =========================================
let state = 'idle'; // idle | listening | thinking | speaking
let recognition = null;
let conversationHistory = [];
let mediaRecorder = null;
let audioChunks = [];

// =========================================
// ORB STATE MANAGER
// =========================================
function setState(s) {
  state = s;
  const orb = document.getElementById('orbBtn');
  const wrap = document.getElementById('orbWrap');
  const label = document.getElementById('orbLabel');

  orb.className = 'orb ' + s;
  wrap.className = 'orb-wrap ' + s;

  const labels = {
    idle: 'Tap to Speak',
    listening: 'Listening...',
    thinking: 'Processing...',
    speaking: 'Speaking...'
  };
  label.textContent = labels[s];

  // Swap mic icon for waveform when listening
  const micIcon = orb.querySelector('.mic-icon, .waveform');
  if (micIcon) micIcon.remove();

  if (s === 'listening') {
    const wf = document.createElement('div');
    wf.className = 'waveform';
    wf.innerHTML = '<div class="bar"></div>'.repeat(5);
    orb.insertBefore(wf, orb.querySelector('span'));
  } else {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'mic-icon');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.5');
    svg.setAttribute('stroke-linecap', 'round');
    svg.innerHTML = `
      <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="8" y1="22" x2="16" y2="22"/>
    `;
    orb.insertBefore(svg, orb.querySelector('span'));
  }

  orb.disabled = (s === 'thinking');
  document.getElementById('sendBtn').disabled = (s === 'thinking' || s === 'listening');
}

// =========================================
// CHAT LOG
// =========================================
function addMessage(role, text, isThinking=false) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.id = isThinking ? 'thinkingMsg' : '';

  const avatarText = role === 'assistant' ? 'JV' : 'YOU';
  const label = role === 'assistant' ? 'Jarvis' : 'You';
  const content = isThinking
    ? `<div class="thinking-dots"><span></span><span></span><span></span></div>`
    : `<div class="bubble">${text}</div>`;

  div.innerHTML = `
    <div class="avatar">${avatarText}</div>
    <div>
      <div class="msg-label">${label}</div>
      ${content}
    </div>
  `;

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function removeThinking() {
  const el = document.getElementById('thinkingMsg');
  if (el) el.remove();
}

// =========================================
// SPEAK (browser TTS)
// =========================================
function speak(text) {
  return new Promise(resolve => {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.05;
    utter.pitch = 0.85;
    utter.volume = 1;

    // Try to get a deep male English voice
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.name.includes('Google UK English Male') ||
      v.name.includes('Daniel') ||
      v.name.includes('Microsoft David') ||
      v.lang === 'en-GB'
    ) || voices.find(v => v.lang.startsWith('en'));
    if (preferred) utter.voice = preferred;

    utter.onend = resolve;
    utter.onerror = resolve;
    setState('speaking');
    window.speechSynthesis.speak(utter);
    utter.onend = () => { setState('idle'); resolve(); };
  });
}

// =========================================
// SEND TO BACKEND
// =========================================
async function sendToBackend(userText) {
  addMessage('user', userText);
  conversationHistory.push({ role: 'user', text: userText });

  setState('thinking');
  addMessage('assistant', '', true);
  setError('');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: userText,
        history: conversationHistory.slice(-8)
      })
    });

    const data = await res.json();
    const reply = data.reply || "I'm sorry, sir. Could you repeat that?";

    removeThinking();
    addMessage('assistant', reply);
    conversationHistory.push({ role: 'assistant', text: reply });

    // Exit command
    if (/\b(exit|goodbye|shut down|shutting down)\b/i.test(userText)) {
      await speak(reply);
      setState('idle');
      return;
    }

    await speak(reply);
  } catch (e) {
    removeThinking();
    setError('Server error. Is the backend running?');
    setState('idle');
  }
}

// =========================================
// VOICE INPUT — Record audio → send to /transcribe
// =========================================
async function toggleListen() {
  if (state === 'listening') {
    stopRecording();
    return;
  }
  if (state !== 'idle') return;

  // Stop any ongoing speech
  window.speechSynthesis.cancel();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById('micStatus').textContent = '● MIC ACTIVE';
    document.getElementById('micStatus').classList.add('online');

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      document.getElementById('micStatus').textContent = 'MIC READY';
      document.getElementById('micStatus').classList.remove('online');
      document.getElementById('transcriptDisplay').textContent = '';

      if (audioChunks.length === 0) { setState('idle'); return; }

      // Send audio to server for Whisper transcription
      setState('thinking');
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', blob, 'recording.webm');

      try {
        const res = await fetch('/transcribe', { method: 'POST', body: formData });
        const data = await res.json();
        const text = (data.text || '').trim();

        if (!text) {
          setState('idle');
          setError('Could not understand audio. Try again.');
          return;
        }

        setError('');
        await sendToBackend(text);
      } catch (e) {
        setState('idle');
        setError('Transcription failed. Is the backend running?');
      }
    };

    mediaRecorder.start();
    setState('listening');

    // Live transcript via browser SpeechRecognition (visual only)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onresult = e => {
        const t = Array.from(e.results).map(r => r[0].transcript).join('');
        document.getElementById('transcriptDisplay').textContent = '"' + t + '"';
      };
      recognition.start();
    }

  } catch (e) {
    setError('Microphone access denied.');
    setState('idle');
  }
}

function stopRecording() {
  if (recognition) { try { recognition.stop(); } catch(_) {} recognition = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

// =========================================
// TEXT INPUT
// =========================================
async function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text || state === 'thinking' || state === 'listening') return;
  input.value = '';
  await sendToBackend(text);
}

// =========================================
// ERROR
// =========================================
function setError(msg) {
  document.getElementById('errorMsg').textContent = msg;
}

// =========================================
// INIT
// =========================================
window.speechSynthesis.onvoiceschanged = () => {}; // preload voices

// Greet with voice on load
window.addEventListener('load', () => {
  setTimeout(() => speak("Jarvis activated. Good to see you, sir. How can I assist?"), 1000);
});
</script>
</body>
</html>
